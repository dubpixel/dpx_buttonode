name: Release — dpx-buttnode Images

# Triggers:
#   1. Manual dispatch (on-demand, any time)
#   2. Daily schedule — builds only if the mirror has a version not yet released
#
# No Bitfocus credentials required. Version is read from the .tar.gz filename
# in the 'buttons-deb-mirror' GitHub Release.
on:
  workflow_dispatch:
    inputs:
      force:
        description: 'Force build even if this version was already released'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

  schedule:
    - cron: '0 6 * * *'

jobs:
  # ── Check if the mirror has a version we haven't built yet ─────────────────
  check-version:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      should-build: ${{ steps.compare.outputs.should-build }}
      buttons-version: ${{ steps.mirror.outputs.buttons-version }}

    steps:
      - name: Read version from mirror release asset filename
        id: mirror
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Get the .tar.gz asset name from the mirror release
          ASSET=$(gh release view buttons-deb-mirror \
            --repo "${{ github.repository }}" \
            --json assets \
            --jq '[.assets[].name | select(endswith(".tar.gz"))] | first')

          if [[ -z "$ASSET" || "$ASSET" == "null" ]]; then
            echo "ERROR: No .tar.gz asset found in the 'buttons-deb-mirror' release."
            echo "Run: ./scripts/upload-mirror.sh <path-to-tarball>"
            exit 1
          fi

          # Extract version from: bitfocus-buttons-usb-relay-headless_0.1.0-beta.4_arm64.tar.gz
          VERSION=$(echo "$ASSET" | sed 's/.*_\(.*\)_arm64.tar.gz/\1/')

          echo "Mirror asset   : $ASSET"
          echo "Mirror version : $VERSION"
          echo "buttons-version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Compare against latest published release
        id: compare
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE: ${{ github.event.inputs.force || 'false' }}
        run: |
          MIRROR_VERSION="${{ steps.mirror.outputs.buttons-version }}"

          # Check if any release already exists for this Buttons version.
          # NOTE: no repo checkout in this job, so we cannot read the VERSION
          # file here. Match by Buttons-version prefix instead — if a
          # dpx-buttnode-<version>-build* tag exists at all, we're done.
          MATCHING_TAG=$(gh release list \
            --repo "${{ github.repository }}" \
            --exclude-drafts \
            --limit 30 \
            --json tagName \
            --jq "[.[].tagName | select(startswith(\"dpx-buttnode-${MIRROR_VERSION}-build\"))] | first" \
            2>/dev/null || echo "")

          echo "Mirror version : ${MIRROR_VERSION}"
          echo "Matching tag   : ${MATCHING_TAG:-none}"

          if [[ "$FORCE" == "true" ]]; then
            echo "Force flag set — building regardless."
            echo "should-build=true" >> "$GITHUB_OUTPUT"
          elif [[ -n "$MATCHING_TAG" ]]; then
            echo "Already released as ${MATCHING_TAG}. Nothing to do."
            echo "should-build=false" >> "$GITHUB_OUTPUT"
          else
            echo "New version detected — triggering build."
            echo "should-build=true" >> "$GITHUB_OUTPUT"
          fi

  # ── Matrix build across all supported boards ──────────────────────────────
  # TODO: make 'full' optional — add a 'build-full' boolean input so full images
  # are opt-in per release rather than always built (doubles CI time).
  build:
    needs: check-version
    if: needs.check-version.outputs.should-build == 'true'
    strategy:
      fail-fast: false
      matrix:
        board:
          - rockpi-s
          - orangepizero3
        variant:
          - lite
          - full
    uses: ./.github/workflows/armbian-builder.yaml
    with:
      armbian-board: ${{ matrix.board }}
      variant: ${{ matrix.variant }}
    permissions:
      contents: read

  # ── Create GitHub Release with all board images ───────────────────────────
  release:
    needs: [check-version, build]
    if: needs.check-version.outputs.should-build == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: List release assets
        run: ls -lh release-assets/

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.check-version.outputs.buttons-version }}
          FORCE: ${{ github.event.inputs.force || 'false' }}
        run: |
          BUILD_VERSION=$(cat VERSION)
          TAG="dpx-buttnode-${VERSION}-build${BUILD_VERSION}"
          SAT_VERSION=$(node -e "console.log(require('/opt/companion-satellite/package.json').version)" 2>/dev/null || echo "unknown")
          bash scripts/generate-release-notes.sh \
            "$VERSION" release-assets "$BUILD_VERSION" \
            "${{ github.ref_name }}" "$(echo '${{ github.sha }}' | cut -c1-7)" "$SAT_VERSION"

          # Write buttons-version.txt for release notes
          echo "$VERSION" > /tmp/buttons-version.txt

          # On force rebuild: replace the existing release for this exact tag
          if [[ "$FORCE" == "true" ]]; then
            gh release delete "$TAG" --repo "${{ github.repository }}" --yes --cleanup-tag 2>/dev/null || true
          fi

          gh release create "$TAG" \
            --repo "${{ github.repository }}" \
            --title "dpx-buttnode v${BUILD_VERSION} — Buttons ${VERSION}" \
            --notes-file /tmp/release-notes.md \
            release-assets/*.img.gz \
            /tmp/buttons-version.txt
